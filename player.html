<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Now Playing</title>
  <meta name="description" content="Listen to concert recordings">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">

  <style>
    * { box-sizing: border-box; }

    body {
      background: #0a0a0b;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .card {
      background: #18181b;
      border: 1px solid #27272a;
    }

    .control-btn {
      transition: all 0.15s ease;
    }

    .control-btn:hover {
      background: #27272a;
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .playlist-item {
      transition: all 0.15s ease;
      border-left: 2px solid transparent;
    }

    .playlist-item:hover {
      background: #1f1f23;
    }

    .playlist-item.active {
      background: rgba(59, 130, 246, 0.1);
      border-left-color: #3b82f6;
    }

    .progress-bar {
      transition: width 0.1s linear;
    }

    input[type="range"] {
      -webkit-appearance: none;
      background: transparent;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #3b82f6;
      cursor: pointer;
      margin-top: -4px;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      background: #27272a;
      border-radius: 2px;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen">

  <!-- Header -->
  <header class="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur-sm sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 text-zinc-400 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
        <span class="text-sm">Back</span>
      </a>
      <div class="flex items-center gap-3">
        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
        </svg>
        <span class="text-sm font-medium text-white">Live Music Archive</span>
      </div>
      <div class="flex items-center gap-4">
        <a id="archive-link" href="#" target="_blank" rel="noopener" class="text-xs text-zinc-500 hover:text-zinc-300 transition-colors">
          View on Archive.org
        </a>
        <div id="auth-area"></div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

    <!-- Show Title -->
    <div class="text-center">
      <h1 id="show-title" class="text-xl font-semibold text-white">Loading...</h1>
      <div class="flex items-center justify-center gap-3 mt-2">
        <div id="favorite-btn-container"></div>
        <div id="collection-btn-container"></div>
      </div>
    </div>

    <!-- Player Card -->
    <div id="player-wrapper" class="card rounded-xl p-5">

      <!-- Loading State -->
      <div id="loading-placeholder" class="py-12 text-center">
        <div class="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
        <p class="text-sm text-zinc-500">Loading player...</p>
      </div>

      <!-- Player Content -->
      <div id="custom-player" class="hidden space-y-5">

        <!-- Visualizer -->
        <div class="h-20 bg-zinc-900 rounded-lg overflow-hidden">
          <canvas id="visualizerCanvas" class="w-full h-full"></canvas>
        </div>

        <!-- Now Playing -->
        <div class="text-center py-2">
          <div class="text-xs text-zinc-500 mb-1">Now Playing</div>
          <h2 id="trackTitle" class="text-lg font-medium text-white"></h2>
          <div id="trackInfo" class="text-xs text-zinc-500 mt-1"></div>
        </div>

        <!-- Progress -->
        <div class="space-y-2">
          <div class="relative h-1 bg-zinc-800 rounded-full overflow-hidden">
            <div id="bufferBar" class="absolute h-full bg-zinc-700 progress-bar" style="width: 0%"></div>
            <div id="progressBar" class="absolute h-full bg-blue-500 progress-bar" style="width: 0%"></div>
          </div>
          <div class="flex justify-between text-xs text-zinc-500">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
          </div>
          <input type="range" id="trackProgress" class="absolute inset-0 w-full opacity-0 cursor-pointer" min="0" max="100" value="0" style="margin-top: -20px; height: 20px;">
        </div>

        <!-- Controls -->
        <div class="flex items-center justify-center gap-2">
          <button id="shuffleButton" class="control-btn p-2 rounded-lg text-zinc-500" title="Shuffle">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6h-12m0 0l4 4m-4-4l4-4" />
            </svg>
          </button>

          <button id="prevTrack" class="control-btn p-3 rounded-lg text-white" title="Previous">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
          </button>

          <button id="playPause" class="w-14 h-14 rounded-full bg-blue-600 hover:bg-blue-500 flex items-center justify-center transition-colors" title="Play">
            <svg id="playIcon" class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </button>

          <button id="nextTrack" class="control-btn p-3 rounded-lg text-white" title="Next">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </button>

          <button id="loopButton" class="control-btn p-2 rounded-lg text-zinc-500" title="Loop">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>
        </div>

        <!-- Volume -->
        <div class="flex items-center justify-center gap-3 max-w-xs mx-auto">
          <button id="muteButton" class="text-zinc-500 hover:text-white transition-colors">
            <svg id="volumeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
            </svg>
          </button>
          <div class="flex-1 relative">
            <div class="h-1 bg-zinc-800 rounded-full overflow-hidden">
              <div id="volumeBar" class="h-full bg-blue-500 progress-bar" style="width: 100%"></div>
            </div>
            <input type="range" id="volumeControl" class="absolute inset-0 w-full opacity-0 cursor-pointer" min="0" max="100" value="100">
          </div>
        </div>

        <audio id="audioElement" class="hidden" crossorigin="anonymous"></audio>
      </div>
    </div>

    <!-- Playlist -->
    <div class="card rounded-xl overflow-hidden">
      <div class="px-4 py-3 border-b border-zinc-800 flex items-center justify-between">
        <h3 class="text-sm font-medium text-white">Setlist</h3>
        <span id="playlistInfo" class="text-xs text-zinc-500"></span>
      </div>
      <div id="playlistContainer" class="max-h-64 overflow-y-auto"></div>
    </div>

    <!-- Show Info -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div id="show-info" class="card rounded-xl p-4">
        <h3 class="text-sm font-medium text-white mb-3">Show Details</h3>
        <div class="show-info-content space-y-2 text-sm text-zinc-400"></div>
      </div>
      <div id="additional-info" class="card rounded-xl p-4">
        <h3 class="text-sm font-medium text-white mb-3">Additional Info</h3>
        <div class="additional-info-content space-y-2 text-sm text-zinc-400"></div>
      </div>
    </div>

    <!-- Keyboard Shortcuts -->
    <div class="text-center text-xs text-zinc-600 py-4">
      <span class="text-zinc-500">Shortcuts:</span>
      <kbd class="mx-1 px-1.5 py-0.5 bg-zinc-800 rounded">Space</kbd> Play/Pause
      <kbd class="mx-1 px-1.5 py-0.5 bg-zinc-800 rounded">N</kbd> Next
      <kbd class="mx-1 px-1.5 py-0.5 bg-zinc-800 rounded">P</kbd> Previous
      <kbd class="mx-1 px-1.5 py-0.5 bg-zinc-800 rounded">M</kbd> Mute
    </div>

  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
