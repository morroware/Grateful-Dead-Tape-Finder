<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collection - Live Music Archive</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    * { box-sizing: border-box; }
    body { background: #0a0a0b; color: #e4e4e7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .card { background: #18181b; border: 1px solid #27272a; }
    .show-card { background: #18181b; border: 1px solid #27272a; }
    .show-card:hover { border-color: #3b82f6; background: #1c1c20; }
  </style>
</head>
<body class="min-h-screen">

  <!-- Header -->
  <header class="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
        </svg>
        <h1 class="text-lg font-semibold text-white">Live Music Archive</h1>
      </a>
      <div id="auth-area"></div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <div id="collection-loading" class="text-center py-16">
      <div class="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
      <p class="text-sm text-zinc-500">Loading collection...</p>
    </div>

    <div id="collection-content" class="hidden">
      <div class="mb-8">
        <h2 id="coll-name" class="text-2xl font-bold text-white mb-1"></h2>
        <p id="coll-desc" class="text-sm text-zinc-400 mb-2"></p>
        <div class="flex items-center gap-3 text-xs text-zinc-500">
          <span>by <span id="coll-owner" class="text-zinc-300"></span></span>
          <span id="coll-count"></span>
        </div>
      </div>

      <div id="coll-items" class="space-y-3"></div>
    </div>

    <div id="collection-error" class="hidden text-center py-16">
      <svg class="w-16 h-16 mx-auto text-zinc-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <h3 id="error-title" class="text-xl font-bold text-zinc-300 mb-2">Collection not found</h3>
      <p id="error-msg" class="text-zinc-500">This collection may be private or deleted.</p>
      <a href="index.html" class="inline-block mt-4 px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm transition-colors">
        Browse Shows
      </a>
    </div>
  </main>

  <script type="module">
    import { getCollection } from './js/api.js';
    import { initAuth } from './js/auth.js';

    document.addEventListener('DOMContentLoaded', async () => {
      await initAuth().catch(() => {});

      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');

      if (!slug) {
        showError('No collection specified', 'Add a ?slug=name parameter to the URL.');
        return;
      }

      try {
        const data = await getCollection(slug);
        if (!data || !data.collection) {
          showError('Collection not found', 'This collection may be private or deleted.');
          return;
        }

        document.getElementById('collection-loading').classList.add('hidden');
        document.getElementById('collection-content').classList.remove('hidden');

        const c = data.collection;
        document.title = c.name + ' - Live Music Archive';
        document.getElementById('coll-name').textContent = c.name;
        document.getElementById('coll-desc').textContent = c.description || '';
        document.getElementById('coll-owner').textContent = c.owner.display_name || c.owner.username;
        document.getElementById('coll-count').textContent = (data.items ? data.items.length : 0) + ' shows';

        const container = document.getElementById('coll-items');
        if (!data.items || data.items.length === 0) {
          container.innerHTML = '<div class="text-center py-12 text-zinc-500">This collection is empty</div>';
          return;
        }

        container.innerHTML = data.items.map((item, i) => `
          <div class="show-card rounded-lg p-4 cursor-pointer transition-all"
               onclick="window.location.href='player.html?id=${item.identifier}'">
            <div class="flex items-center gap-4">
              <span class="text-sm text-zinc-500 w-8 text-right flex-shrink-0">${i + 1}.</span>
              <div class="flex-1 min-w-0">
                <div class="text-sm font-medium text-white truncate">${escapeHtml(item.title || item.identifier)}</div>
                <div class="text-xs text-zinc-500">${escapeHtml(item.creator || '')}</div>
              </div>
            </div>
          </div>
        `).join('');

      } catch (error) {
        showError('Error loading collection', error.message || 'Please try again later.');
      }
    });

    function showError(title, message) {
      document.getElementById('collection-loading').classList.add('hidden');
      document.getElementById('collection-error').classList.remove('hidden');
      document.getElementById('error-title').textContent = title;
      document.getElementById('error-msg').textContent = message;
    }

    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
  </script>
</body>
</html>
