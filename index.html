<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Music Archive</title>

  <meta name="description" content="Explore thousands of live concert recordings from the Internet Archive.">
  <meta name="keywords" content="live music, concert recordings, archive.org, soundboard, audience recordings">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Live Music Archive">
  <meta property="og:description" content="Discover and stream thousands of live concert recordings.">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">

  <style>
    * { box-sizing: border-box; }

    body {
      background: #0a0a0b;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .search-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .card {
      background: #18181b;
      border: 1px solid #27272a;
      transition: all 0.15s ease;
    }

    .card:hover {
      border-color: #3f3f46;
      background: #1f1f23;
    }

    .filter-chip {
      transition: all 0.15s ease;
    }

    .filter-chip.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: white;
    }

    .btn-primary {
      background: #3b82f6;
      transition: all 0.15s ease;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .view-btn.active {
      background: #27272a;
      color: white;
    }

    select, input[type="text"], input[type="number"] {
      background: #18181b;
      border: 1px solid #27272a;
      color: #e4e4e7;
    }

    select:focus, input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    .tag-sbd { background: #14532d; color: #86efac; }
    .tag-aud { background: #713f12; color: #fcd34d; }
    .tag-matrix { background: #581c87; color: #d8b4fe; }

    .show-card {
      background: #18181b;
      border: 1px solid #27272a;
    }

    .show-card:hover {
      border-color: #3b82f6;
      background: #1c1c20;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }
  </style>
</head>
<body class="min-h-screen">

  <!-- Compact Header -->
  <header class="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
        </svg>
        <h1 class="text-lg font-semibold text-white">Live Music Archive</h1>
      </div>
      <div class="flex items-center gap-4">
        <div class="hidden sm:flex items-center gap-4 text-xs text-zinc-500">
          <span><kbd class="px-1.5 py-0.5 bg-zinc-800 rounded text-zinc-400">/</kbd> Search</span>
          <span><kbd class="px-1.5 py-0.5 bg-zinc-800 rounded text-zinc-400">R</kbd> Random</span>
        </div>
        <div id="auth-area"></div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">

    <!-- Search Section -->
    <div class="card rounded-lg p-4 mb-6">
      <form id="searchForm" class="space-y-4">

        <!-- Main Search Row -->
        <div class="flex flex-col sm:flex-row gap-3">
          <select id="bandSelector" name="band" class="sm:w-56 px-3 py-2.5 rounded-lg text-sm">
            <optgroup label="Quick Options">
              <option value="AllArchive">All Live Music</option>
              <option value="Collection_Search">Search by Collection</option>
              <option value="Custom">Custom Search</option>
            </optgroup>
            <optgroup label="Dead Family">
              <option value="GratefulDead" selected>Grateful Dead</option>
              <option value="DeadAndCompany">Dead & Company</option>
              <option value="PhilLesh">Phil Lesh & Friends</option>
              <option value="JerryGarciaBand">Jerry Garcia Band</option>
              <option value="RatDog">Ratdog</option>
              <option value="BobWeir">Bob Weir</option>
              <option value="Furthur">Furthur</option>
              <option value="DarkStar">Dark Star Orchestra</option>
              <option value="JRAD">Joe Russo's Almost Dead</option>
            </optgroup>
            <optgroup label="Jam Bands">
              <option value="WidespreadPanic">Widespread Panic</option>
              <option value="StringCheese">String Cheese Incident</option>
              <option value="UmphreysMcGee">Umphrey's McGee</option>
              <option value="moe">moe.</option>
              <option value="DiscoBiscuits">Disco Biscuits</option>
              <option value="STS9">STS9</option>
              <option value="Goose">Goose</option>
              <option value="Lotus">Lotus</option>
              <option value="Spafford">Spafford</option>
            </optgroup>
            <optgroup label="Bluegrass">
              <option value="BillyStrings">Billy Strings</option>
              <option value="GreenskyBluegrass">Greensky Bluegrass</option>
              <option value="YonderMountain">Yonder Mountain</option>
              <option value="LeftoverSalmon">Leftover Salmon</option>
            </optgroup>
            <optgroup label="Other">
              <option value="Lettuce">Lettuce</option>
              <option value="GalacticFunk">Galactic</option>
              <option value="Ween">Ween</option>
              <option value="MyMorningJacket">My Morning Jacket</option>
              <option value="KingGizzard">King Gizzard</option>
              <option value="Tipper">Tipper</option>
            </optgroup>
          </select>

          <div class="flex-1 relative">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input type="text" id="searchQuery" name="searchQuery"
                   class="w-full pl-10 pr-4 py-2.5 rounded-lg text-sm search-input"
                   placeholder="Search shows, venues, dates...">
          </div>

          <button type="button" id="searchButton" class="btn-primary px-6 py-2.5 rounded-lg text-sm font-medium text-white">
            Search
          </button>
        </div>

        <!-- Filters Row -->
        <div class="flex flex-wrap items-center gap-3">
          <!-- Year Range -->
          <div class="flex items-center gap-2">
            <span class="text-xs text-zinc-500">Year:</span>
            <input type="number" id="yearFrom" name="yearFrom" min="1900" max="2030" placeholder="From"
                   class="w-20 px-2 py-1.5 rounded text-sm">
            <span class="text-zinc-600">-</span>
            <input type="number" id="yearTo" name="yearTo" min="1900" max="2030" placeholder="To"
                   class="w-20 px-2 py-1.5 rounded text-sm">
          </div>

          <div class="h-4 w-px bg-zinc-700 hidden sm:block"></div>

          <!-- Quality Filters -->
          <div class="flex items-center gap-2">
            <span class="text-xs text-zinc-500">Quality:</span>
            <button type="button" data-filter="soundboard" class="filter-chip px-3 py-1 rounded text-xs border border-zinc-700 text-zinc-400 hover:border-zinc-500">SBD</button>
            <button type="button" data-filter="aud" class="filter-chip px-3 py-1 rounded text-xs border border-zinc-700 text-zinc-400 hover:border-zinc-500">AUD</button>
            <button type="button" data-filter="matrix" class="filter-chip px-3 py-1 rounded text-xs border border-zinc-700 text-zinc-400 hover:border-zinc-500">Matrix</button>
            <button type="button" data-filter="five-star" class="filter-chip px-3 py-1 rounded text-xs border border-zinc-700 text-zinc-400 hover:border-zinc-500">Top Rated</button>
          </div>

          <div class="flex-1"></div>

          <!-- View Toggle -->
          <div class="flex items-center gap-1 bg-zinc-900 rounded p-0.5">
            <button type="button" data-view="list" class="view-btn active p-1.5 rounded" title="List view">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
            <button type="button" data-view="grid" class="view-btn p-1.5 rounded text-zinc-500 hover:text-zinc-300" title="Grid view">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
              </svg>
            </button>
            <button type="button" data-view="compact" class="view-btn p-1.5 rounded text-zinc-500 hover:text-zinc-300" title="Compact view">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
              </svg>
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Results Header -->
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-sm font-medium text-zinc-400">Results</h2>
      <div id="pageInfo" class="text-xs text-zinc-500"></div>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="hidden py-12">
      <div class="flex flex-col items-center gap-3">
        <div class="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-sm text-zinc-500">Searching...</p>
      </div>
    </div>

    <!-- Results Container -->
    <div id="results" class="space-y-2 min-h-[400px]">
      <!-- Results will appear here -->
    </div>

    <!-- Pagination -->
    <div class="flex items-center justify-center gap-3 py-6">
      <button id="prevPage" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-sm rounded-lg disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
        Previous
      </button>
      <button id="nextPage" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-sm rounded-lg disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2">
        Next
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-zinc-800 py-6 mt-8">
    <div class="max-w-6xl mx-auto px-4 text-center text-xs text-zinc-600">
      <p>Powered by <a href="https://archive.org" target="_blank" rel="noopener" class="text-zinc-500 hover:text-zinc-400">Archive.org</a></p>
    </div>
  </footer>

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed bottom-4 right-4 z-50"></div>

  <script type="module" src="js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // View mode toggle
      const viewButtons = document.querySelectorAll('[data-view]');
      viewButtons.forEach(button => {
        button.addEventListener('click', function(e) {
          e.preventDefault();
          const view = this.dataset.view;

          viewButtons.forEach(btn => {
            btn.classList.remove('active', 'text-white');
            btn.classList.add('text-zinc-500');
          });
          this.classList.add('active', 'text-white');
          this.classList.remove('text-zinc-500');

          const results = document.getElementById('results');
          if (results) {
            if (view === 'grid') {
              results.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 min-h-[400px]';
            } else if (view === 'compact') {
              results.className = 'space-y-1 min-h-[400px]';
            } else {
              results.className = 'space-y-2 min-h-[400px]';
            }
          }

          localStorage.setItem('tapeFinder_viewMode', view);
          if (window.switchView) window.switchView(view);
        });
      });

      // Keyboard shortcuts for view switching (1/2/3)
      // Note: '/' and 'R' shortcuts are handled by search.js
      document.addEventListener('keydown', (e) => {
        if (e.target.matches('input, select, textarea')) return;

        if (e.key === '1' || e.key === '2' || e.key === '3') {
          const views = ['list', 'grid', 'compact'];
          document.querySelector(`[data-view="${views[parseInt(e.key) - 1]}"]`)?.click();
        }
      });
    });
  </script>
</body>
</html>
