<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Live Music Archive</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    * { box-sizing: border-box; }
    body { background: #0a0a0b; color: #e4e4e7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .card { background: #18181b; border: 1px solid #27272a; }
    input[type="text"], input[type="email"], input[type="password"] {
      background: #0a0a0b; border: 1px solid #27272a; color: #e4e4e7;
    }
    input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
        </svg>
        <h1 class="text-lg font-semibold text-white">Live Music Archive</h1>
      </a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">

      <!-- Login Section -->
      <div id="login-section" class="card rounded-xl p-8">
        <h2 class="text-2xl font-bold text-white text-center mb-2">Welcome Back</h2>
        <p class="text-sm text-zinc-400 text-center mb-8">Sign in to save favorites and create collections</p>

        <div id="login-error" class="text-red-400 text-sm text-center mb-4"></div>

        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-sm text-zinc-400 mb-1">Email</label>
            <input type="email" id="login-email" required
                   class="w-full px-4 py-2.5 rounded-lg text-sm" placeholder="you@example.com">
          </div>
          <div>
            <label class="block text-sm text-zinc-400 mb-1">Password</label>
            <input type="password" id="login-password" required
                   class="w-full px-4 py-2.5 rounded-lg text-sm" placeholder="Your password">
          </div>
          <button type="submit"
                  class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg transition-colors">
            Sign In
          </button>
        </form>

        <p class="text-sm text-zinc-500 text-center mt-6">
          Don't have an account?
          <a href="#" id="show-register" class="text-blue-400 hover:text-blue-300">Create one</a>
        </p>
      </div>

      <!-- Register Section -->
      <div id="register-section" class="card rounded-xl p-8 hidden">
        <h2 class="text-2xl font-bold text-white text-center mb-2">Create Account</h2>
        <p class="text-sm text-zinc-400 text-center mb-8">Accounts are optional — you can always browse without one</p>

        <div id="register-error" class="text-red-400 text-sm text-center mb-4"></div>

        <form id="register-form" class="space-y-4">
          <div>
            <label class="block text-sm text-zinc-400 mb-1">Username</label>
            <input type="text" id="reg-username" required minlength="3" maxlength="50"
                   class="w-full px-4 py-2.5 rounded-lg text-sm" placeholder="Choose a username">
          </div>
          <div>
            <label class="block text-sm text-zinc-400 mb-1">Email</label>
            <input type="email" id="reg-email" required
                   class="w-full px-4 py-2.5 rounded-lg text-sm" placeholder="you@example.com">
          </div>
          <div>
            <label class="block text-sm text-zinc-400 mb-1">Password</label>
            <input type="password" id="reg-password" required minlength="8"
                   class="w-full px-4 py-2.5 rounded-lg text-sm" placeholder="At least 8 characters">
          </div>
          <div>
            <label class="block text-sm text-zinc-400 mb-1">Confirm Password</label>
            <input type="password" id="reg-confirm" required
                   class="w-full px-4 py-2.5 rounded-lg text-sm" placeholder="Type password again">
          </div>
          <button type="submit"
                  class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg transition-colors">
            Create Account
          </button>
        </form>

        <p class="text-sm text-zinc-500 text-center mt-6">
          Already have an account?
          <a href="#" id="show-login" class="text-blue-400 hover:text-blue-300">Sign in</a>
        </p>
      </div>

    </div>
  </main>

  <script type="module">
    import { setupLoginForm } from './js/auth.js';
    import { checkAuth } from './js/api.js';

    document.addEventListener('DOMContentLoaded', async () => {
      // If already logged in, redirect
      try {
        const user = await checkAuth();
        if (user) {
          window.location.href = 'index.html';
          return;
        }
      } catch (e) {}

      setupLoginForm();
    });
  </script>
</body>
</html>
